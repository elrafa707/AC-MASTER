# SQL Server local para desarrollo.
#   docker compose up -d            -> levanta SQL Server y aplica los scripts de /database
#   docker compose down             -> lo detiene (los datos se conservan en el volumen)
#   docker compose down -v          -> lo detiene y borra los datos
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: acmaster-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-AcMaster_Dev2026!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Aplica 01_schema, 02_catalogos y 03_seed_dev en orden y termina. Los scripts son idempotentes.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-AcMaster_Dev2026!}
    volumes:
      - ./database:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        for f in /scripts/*.sql; do
          echo "Aplicando $$f"
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -I -f 65001 -i "$$f" || exit 1
        done
        echo "Base de datos lista"
    restart: "no"

volumes:
  sqlserver-data:
